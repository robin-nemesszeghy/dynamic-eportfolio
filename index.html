<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robin Nemesszeghy</title>
    <link rel="stylesheet" href="./style.css" />
    <script
      src="https://kit.fontawesome.com/2e2a207e73.js"
      crossorigin="anonymous"
    ></script>
    <!-- <script src="./script.js" defer></script> -->
  </head>
  <body>
    <section id="landing-page">
      <nav>
        <figure>
          <img
            id="personal-logo"
            src="./assets/white-bird-logo.png"
            alt="Logo Image"
          />
        </figure>
        <ul class="nav__link--list">
          <li class="nav__link">
            <a
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              href="#"
              >About</a
            >
          </li>
          <li class="nav__link">
            <a
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              href="#"
              >Projects</a
            >
          </li>
          <li class="nav__link">
            <a
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              href="#"
              >Contact</a
            >
          </li>
          <li class="nav__link click">
            <a
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              href="#"
              ><i class="fa-solid fa-circle-half-stroke"></i
            ></a>
          </li>
        </ul>
      </nav>
      <header class="header">
        <div class="header__content">
          <h1 class="title">Hey</h1>
          <h1 class="title orange">I'm Robin.</h1>
          <p class="header__para">
            I'm a <b class="orange">Frontend Software Engineer</b> with a strong
            passion for building web applications with great user experiences.
            <br />
            Here's a bit more <b class="orange">about me.</b>
          </p>
          <div class="social__list">
            <a
              class="social__link click"
              href="https://www.linkedin.com/in/robin-nemesszeghy/"
              target="_blank"
              ><i class="fa-brands fa-linkedin-in"></i
            ></a>
            <a
              class="social__link click"
              href="https://github.com/robin-nemesszeghy"
              target="_blank"
              ><i class="fa-brands fa-github"></i
            ></a>
            <a
              class="social__link click"
              href="./assets/Robin Nemesszeghy Resume.pdf"
              target="_blank"
              ><i class="fa-solid fa-file-pdf"></i
            ></a>
          </div>
        </div>
      </header>
      <button class="mail__btn click">
        <i class="fa-solid fa-envelope"></i>
      </button>
      <a href="#projects" class="scroll">
        <div class="scroll__icon click"></div>
      </a>
    </section>
  </body>
</html>
